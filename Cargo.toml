[package]
name = "oh-my-gocd"
version = "0.1.1"
edition = "2024"
description = "Rust Version of oh-my-gocd"
license-file = "LICENSE"
repository = "https://github.com/Y-Square-T3/oh-my-gocd"

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
home = "0.5.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
